<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Roamly AI product flow</title><desc id="d">Three mobile screens showing Explore, AI Planner, and My Trip.</desc><rect width="1280" height="720" rx="28" fill="#edf1eb"/><text x="640" y="70" text-anchor="middle" font-family="Inter,Arial" font-size="25" font-weight="700" fill="#0f1f1a">From inspiration to itinerary</text><text x="640" y="103" text-anchor="middle" font-family="Inter,Arial" font-size="14" fill="#576b61">Explore  →  Ask Roamly AI  →  Review your trip</text>
<g font-family="Inter,Arial"><g transform="translate(130 135)"><rect width="270" height="510" rx="34" fill="#f7f8f3" stroke="#d2dbd3" stroke-width="2"/><text x="26" y="55" font-size="12" fill="#576b61">Good morning, Maya</text><text x="26" y="91" font-size="24" font-weight="700" fill="#0f1f1a">Where are we</text><text x="26" y="120" font-size="24" font-weight="700" fill="#0f1f1a">roaming next?</text><rect x="26" y="148" width="218" height="132" rx="20" fill="#0f4f40"/><text x="45" y="178" font-size="10" font-weight="700" fill="#b8e585">ROAMLY AI</text><text x="45" y="214" font-size="18" font-weight="700" fill="#fff">Plan a remarkable</text><text x="45" y="238" font-size="18" font-weight="700" fill="#fff">trip in seconds.</text><rect x="45" y="251" width="90" height="21" rx="10" fill="#b8e585"/><text x="57" y="265" font-size="8" font-weight="700" fill="#0f4f40">PLAN MY TRIP</text><text x="26" y="325" font-size="14" font-weight="700" fill="#0f1f1a">Explore by mood</text><g fill="#fff"><rect x="26" y="344" width="46" height="50" rx="12"/><rect x="83" y="344" width="46" height="50" rx="12"/><rect x="140" y="344" width="46" height="50" rx="12"/><rect x="197" y="344" width="46" height="50" rx="12"/></g><text x="26" y="437" font-size="14" font-weight="700" fill="#0f1f1a">Near you</text><rect x="26" y="452" width="218" height="42" rx="12" fill="#fff"/></g>
<g transform="translate(505 135)"><rect width="270" height="510" rx="34" fill="#f7f8f3" stroke="#d2dbd3" stroke-width="2"/><text x="26" y="59" font-size="21" font-weight="700" fill="#0f1f1a">Ask Roamly AI</text><text x="26" y="82" font-size="11" fill="#576b61">Your personal travel companion</text><rect x="26" y="108" width="218" height="100" rx="18" fill="#0f4f40"/><text x="45" y="143" font-size="17" font-weight="700" fill="#fff">Tell me what you want.</text><text x="45" y="170" font-size="11" fill="#b8e585">I’ll make a thoughtful plan.</text><g fill="#fff"><rect x="26" y="228" width="66" height="28" rx="14"/><rect x="101" y="228" width="66" height="28" rx="14"/><rect x="176" y="228" width="68" height="28" rx="14"/></g><rect x="26" y="278" width="218" height="108" rx="16" fill="#fff"/><text x="43" y="307" font-size="10" fill="#576b61">Japan for a week with great</text><text x="43" y="325" font-size="10" fill="#576b61">food, calm stays and culture.</text><rect x="26" y="410" width="218" height="48" rx="14" fill="#0f4f40"/><text x="135" y="439" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">CREATE MY ITINERARY →</text></g>
<g transform="translate(880 135)"><rect width="270" height="510" rx="34" fill="#f7f8f3" stroke="#d2dbd3" stroke-width="2"/><text x="26" y="59" font-size="21" font-weight="700" fill="#0f1f1a">Japan in bloom</text><text x="26" y="82" font-size="11" fill="#576b61">12–18 May · 7 days</text><rect x="26" y="108" width="218" height="104" rx="18" fill="#0f4f40"/><text x="45" y="140" font-size="14" font-weight="700" fill="#fff">Your AI-crafted route</text><text x="45" y="170" font-size="13" font-weight="700" fill="#b8e585">Tokyo → Kyoto → Osaka</text><text x="26" y="254" font-size="14" font-weight="700" fill="#0f1f1a">Your itinerary</text><g><rect x="26" y="274" width="218" height="54" rx="13" fill="#fff"/><rect x="26" y="338" width="218" height="54" rx="13" fill="#fff"/><rect x="26" y="402" width="218" height="54" rx="13" fill="#fff"/><rect x="38" y="284" width="38" height="34" rx="10" fill="#b8e585"/><rect x="38" y="348" width="38" height="34" rx="10" fill="#f2e8cf"/><rect x="38" y="412" width="38" height="34" rx="10" fill="#f2e8cf"/></g><text x="90" y="297" font-size="11" font-weight="700" fill="#0f1f1a">Arrive in Tokyo</text><text x="90" y="361" font-size="11" font-weight="700" fill="#0f1f1a">Tokyo food &amp; design</text><text x="90" y="425" font-size="11" font-weight="700" fill="#0f1f1a">Tokyo to Kyoto</text></g></g></svg>